name: Auto Release

on:
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch: {}

concurrency:
  group: auto-release-main
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine version and tag
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "notes=docs/releases/v$VERSION.md" >> "$GITHUB_OUTPUT"

      # The release notes are written and reviewed in the version-bump pull
      # request (docs/releases/v<version>.md; test/docs/release-notes.test.js
      # fails CI without them). Stop here, before anything is tagged, if they
      # are missing.
      - name: Check release notes
        run: |
          NOTES="${{ steps.version.outputs.notes }}"
          if [ ! -s "$NOTES" ]; then
            echo "::error file=$NOTES::Release notes $NOTES are missing or empty. Add them, then re-run this workflow."
            exit 1
          fi

      - name: Create tag if missing
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping tag creation."
          else
            # The tag message is the full release notes. --cleanup=verbatim
            # keeps the Markdown headings: by default git drops every line
            # that starts with '#' as a comment.
            git tag -a "$TAG" -F "${{ steps.version.outputs.notes }}" --cleanup=verbatim
            git push origin "$TAG"
          fi

      - name: Create GitHub Release if missing
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            gh release create "$TAG" --title "$TAG" --notes-file "${{ steps.version.outputs.notes }}"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      # A release created by this workflow's own GITHUB_TOKEN does not
      # trigger other workflows' `release` events (GitHub's built-in
      # anti-recursion guard) — explicitly dispatch publish.yml instead,
      # which IS exempt from that restriction.
      - name: Trigger npm publish
        if: steps.release.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish.yml --ref main
