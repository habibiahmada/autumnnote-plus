packages:
  - packages/*
overrides:
  form-data: 4.0.6
  ws: 8.21.0
  # Transitive dev-only advisories, all reached through build tooling only
  # (eslint>minimatch, vite/vitest, @vitejs/plugin-vue>vue>@vue/compiler-sfc):
  #   brace-expansion  GHSA — DoS via unbounded intermediate arrays
  #   postcss          GHSA-6g55-p6wh-862q follow-up — arbitrary .map read
  #   nanoid           custom generators loop forever when size is 0
  #   undici           GHSA-rfgv-xxqx-mfg5 / -w293-vg96-wgc3 / -vp8m-p9jh-q5pm (jsdom)
  #   source-map-js    GHSA-68fv-2mgg-jv7q — event-loop DoS (@vue/compiler-*)
  #   vite             GHSA-587h-7wmj-h5pm — launch-editor existence check bypass on
  #                    Windows (dev server only; vitest carries its own vite)
  # Each is a patch-level bump within the same major, so pinning forward is
  # safe. Raise these to the advisory's `patched_versions` — a floor that
  # merely satisfies an older advisory silently stops holding when the next
  # one lands, which is how `pnpm audit --audit-level high` in CI went red.
  brace-expansion: '>=5.0.11'
  postcss: '>=8.5.23'
  nanoid: '>=3.3.17'
  undici: '>=8.10.2'
  source-map-js: '>=1.2.2'
  # Caret, not >=: a vite major would change the build, not just patch it.
  vite: '^8.2.4'
auditConfig:
  # picomatch <=4.0.7 (GHSA-fc5q-39xc-vjpf, ReDoS through repeated extglobs).
  # No patched release exists yet: 4.0.7 is the latest on npm, so there is
  # nothing to override to. picomatch is reached only through dev tooling
  # (@vitest/browser > @vitest/mocker > vite) and only matches the project's own
  # globs, never input from users. Remove this entry once picomatch ships a
  # fix, and add a `picomatch` override above if vite does not pick it up.
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
